<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
    }
    .container {
      background-color: #ffffff;
      max-width: 700px;
      margin: 0 auto;
      padding: 25px 30px;
      border: 1px solid #e0e0e0;
    }
    h2 {
      margin: 0 0 5px 0;
    }
    .subtitle {
      color: #555;
      margin: 0 0 15px 0;
    }
    hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      background-color: #f1f1f1;
      border: none;
    }
    .remember {
      margin-bottom: 15px;
    }
    .terms {
      margin-bottom: 20px;
    }
    .terms a {
      color: #337ab7;
      text-decoration: none;
    }
    .btn-row {
      display: flex;
    }
    .btn {
      flex: 1;
      padding: 14px 0;
      border: none;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-cancel {
      background-color: #f0554f;
    }
    .btn-signup {
      background-color: #4caf50;
    }

    /* Tablet View */
    @media only screen and (max-width: 768px) {
      .btn-row {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }

    /* Mobile View */
    @media only screen and (max-width: 480px) {
      .container {
        padding: 15px;
      }
      .btn-row {
        flex-direction: row;
      }
      .btn {
        font-size: 13px;
        padding: 10px 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Sign Up</h2>
    <p class="subtitle">Please fill in this form to create an account.</p>
    <hr>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter Email" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter Password" required>

    <label for="repeat-password">Repeat Password</label>
    <input type="password" id="repeat-password" placeholder="Repeat Password" required>

    <div class="remember">
      <input type="checkbox" id="remember" checked>
      <label for="remember" style="display:inline; font-weight:normal;">Remember me</label>
    </div>

    <p class="terms">By creating an account you agree to our <a href="#">Terms &amp; Privacy</a></p>

    <div class="btn-row">
      <button class="btn btn-cancel">Cancel</button>
      <button class="btn btn-signup">Sign Up</button>
    </div>
  </div>

</body>
</html>
