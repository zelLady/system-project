<!DOCTYPE html>
<html>
<head>
	<style>
		* {
			box-sizing: border-box; }
			body {
				margin: 0; }
				header {
					background-color: #f1f1f1;
					padding: 20px;
					text-align: center; }
					nav {
						overflow: hidden;
						background-color: #333; }
						nav a {
							float: left;
							display: block;
							color: #f2f2f2;
							text-align: center;
							padding: 14px 16px;
							text-decoration: none; }
							nav a:hover {
								background-color: #ddd;
								color: black; }
								.column {
									float: left;
									width: 33.33%;
									padding: 15px; }
									.row:after {
										content: "";
										display: table;
										clear: both; }
										footer {
											background-color: #f1f1f1;
											padding: 10px;
											text-align: center; }
										</style>
									</head>
									<body>
										<header>
											<h1>HEADING</h1>
											<p>Sub-Heading</p>
										</header>
										<nav>
											<a href="#">Link</a>
											<a href="#">Link</a>
											<a href="#">Link</a>
											<a href="#" style="float:right">Link</a>
										</nav>
										<div class="row">
											<div class="column">
												<h2>Column</h2>

											</div>
											<div class="column">
												<h2>Column</h2>
												<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. </p>
											</div>
											<div class="column">
												<h2>Column</h2>
												<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. </p>
											</div>
										</div>
										<footer>
											<h2>FOOTER</h2>
										</footer>
									</body>
									</html>
